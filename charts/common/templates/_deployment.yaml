{{- define "common.deployment.tpl" -}}
{{- $hpaProvided := .Values.hpa | default dict }}
{{- $hpaEnabled := $hpaProvided.enabled | default false }}
{{- $serviceAccount := .Values.serviceAccount }}
{{- $serviceAccountCreate := $serviceAccount.create | default false }}
{{- $image := .Values.image | default dict -}}
{{- $pullSecretsEnabled := $image.pullSecretsEnabled -}}
{{- $persistence := .Values.persistence | default dict -}}
{{- $configmap := .Values.configmap | default dict -}}
---
apiVersion: apps/v1
kind: Deployment
{{ template "common.metadata.deployment" . }}
spec:
  {{- if not $hpaEnabled }}
  {{- $replicas := default 1 .Values.replicas }}
  replicas: {{ $replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "common.labels.selector" . | nindent 6 }}
  {{- if eq (default "RollingUpdate" .Values.deploymentStrategy) "Recreate" }}
  strategy: {{- include "common.deployment.strategy.recreate" . | nindent 4 }}
  {{- else }}
  strategy: {{- include "common.deployment.strategy.rollingUpdate" . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels: {{- include "common.labels.standard" . | nindent 8 }}
      {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      annotations: {{- include "common.annotations.deployment" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ template "common.serviceAccountName" . }}
      {{- if hasKey .Values "automountServiceAccountToken" }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- end }}
      {{- if hasKey .Values "enableServiceLinks" }}
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      {{- end }}
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "common.affinity" . | nindent 6 }}
      {{- include "common.topologySpread" . | nindent 6 }}
      {{- include "common.tolerations" . | nindent 6 }}
      {{- include "common.security.context" . | nindent 6 }}
      {{- if $pullSecretsEnabled }}
      {{- $pullSecrets := default (tuple "docker-registry") $image.pullSecrets }}
      imagePullSecrets:
      {{- range $pullSecrets }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      {{- include "common.dra.resourceClaims" . | nindent 6 }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      -
{{ include "common.container.tpl" . | indent 8 }}
      {{- if or .Values.volumes (and $persistence.enabled $persistence.mountPath) $configmap.mountPath }}
      volumes:
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if and $persistence.enabled $persistence.mountPath }}
        - name: {{ default "data" $persistence.volumeName }}
          persistentVolumeClaim:
            claimName: {{ $persistence.existingClaim | default (include "common.fullname" .) }}
        {{- end }}
        {{- if $configmap.mountPath }}
        - name: {{ default "config" $configmap.volumeName }}
          configMap:
            name: {{ template "common.fullname" . }}
        {{- end }}
      {{- end }}
{{- end -}}
{{- define "common.deployment" -}}
{{- template "common.util.merge" (append . "common.deployment.tpl") -}}
{{- end -}}
