{{- define "common.affinity"}}
{{- $labels := default (tuple "kubernetes.io/hostname" "topology.kubernetes.io/zone") .Values.antiAffinityLabels -}}
{{- $nodeAffinity := .Values.nodeAffinity | default (dict) | toYaml -}}
affinity:
  nodeAffinity: {{- $nodeAffinity | nindent 4 }}
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    {{- range $labels }}
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - {{ template "common.name" $ }}
            - key: app.kubernetes.io/instance
              operator: In
              values:
                - {{ template "common.fullname" $ }}
        topologyKey: {{ . }}
    {{- end }}
{{- end -}}

{{- /*
common.topologySpread renders topologySpreadConstraints that keep the replicas of this
release apart, one constraint per key in topologySpread.topologyKeys (nothing when empty).

Values:
  topologySpread:
    topologyKeys: []                 # e.g. [topology.kubernetes.io/zone, kubernetes.io/hostname]
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway  # or DoNotSchedule
*/ -}}
{{- define "common.topologySpread" -}}
{{- $spread := .Values.topologySpread | default dict -}}
{{- if $spread.topologyKeys }}
topologySpreadConstraints:
{{- range $spread.topologyKeys }}
  - maxSkew: {{ default 1 $spread.maxSkew }}
    topologyKey: {{ . }}
    whenUnsatisfiable: {{ default "ScheduleAnyway" $spread.whenUnsatisfiable }}
    labelSelector:
      matchLabels: {{- include "common.labels.selector" $ | nindent 8 }}
    matchLabelKeys:
      - pod-template-hash
{{- end }}
{{- end }}
{{- end -}}
