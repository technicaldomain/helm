{{- define "common.container.tpl" -}}
{{- $fullname := include "common.fullname" . -}}
{{- $config := default (dict) .Values.config -}}
{{- $lifecycle := default "" .Values.lifecycle -}}
{{- $healthCheck := default (dict) .Values.healthCheck -}}
{{- $configmap := default (dict) .Values.configmap -}}
{{- $configmapEnabled := true -}}
{{- if hasKey $configmap "enabled" -}}
{{-   $configmapEnabled = $configmap.enabled -}}
{{- end -}}
name: app
image: "{{ default "ghcr.io/technicaldomain" .Values.image.registry }}/{{ .Values.image.name }}:{{ .Values.image.tag | default (include "common.chart.appVersion" .) }}"
imagePullPolicy: {{ default "IfNotPresent" .Values.image.pullPolicy }}
{{ include "common.security.containerContext" . -}}
{{- with .Values.command }}
command:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- with .Values.args }}
args:
  {{- toYaml . | nindent 2 }}
{{- end }}
ports:
- name: {{ default "http" $config.portName }}
  containerPort: {{ default "8080" $config.port }}
  protocol: TCP
{{- if .Values.lifecycle }}
{{- if eq $lifecycle "spa" }}
lifecycle:
  preStop:
    exec:
      command:
      - /usr/sbin/nginx
      - -s
      - quit
{{- end }}
{{- end }}
{{- if or $configmapEnabled .Values.sharedConfigs .Values.sharedSecrets .Values.envFrom .Values.secretData }}
envFrom:
{{- if .Values.envFrom }}
  {{- toYaml .Values.envFrom | nindent 0 }}
{{- else }}
{{- if $configmapEnabled }}
  - configMapRef:
      name: {{ template "common.fullname" . }}
{{- end }}
{{- if .Values.secretData }}
  - secretRef:
      name: {{ template "common.fullname" . }}
{{- end }}
  {{ include "common.envvar.shared.configs" . | indent 2 }}
  {{ include "common.envvar.shared.secrets" . | indent 2 }}
{{- end }}
{{- end }}
{{- if or .Values.env .Values.secretRefs }}
env:
  {{- if .Values.env }}
  {{- toYaml .Values.env | nindent 2 }}
  {{- end }}
  {{- range $envName, $ref := .Values.secretRefs }}
  - name: {{ $envName }}
    valueFrom:
      secretKeyRef:
        name: {{ $ref.name }}
        key: {{ $ref.key }}
  {{- end }}
{{- end }}
{{- /* healthCheck.kind (http | tcp | disabled) applies to every probe; a probe's own `kind` wins. */ -}}
{{- range $probe := list "liveness" "readiness" "startup" }}
{{- $kind := default $healthCheck.kind (index $healthCheck $probe | default dict).kind }}
{{- if eq $kind "tcp" }}
{{ include (printf "common.healthcheck.%s.tcp" $probe) $ }}
{{- else if ne $kind "disabled" }}
{{ include (printf "common.healthcheck.%s" $probe) $ }}
{{- end }}
{{- end }}
{{ include "common.resources" . }}
{{- $persistence := .Values.persistence | default dict }}
{{- if or .Values.volumeMounts (and $persistence.enabled $persistence.mountPath) }}
volumeMounts:
  {{- with .Values.volumeMounts }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  {{- if and $persistence.enabled $persistence.mountPath }}
  - name: {{ default "data" $persistence.volumeName }}
    mountPath: {{ $persistence.mountPath }}
  {{- end }}
{{- end }}
{{- end -}}
{{- define "common.container" -}}
{{- /* clear new line so indentation works correctly */ -}}
{{- println "" -}}
{{- include "common.util.merge" (append . "common.container.tpl") | indent 8 -}}
{{- end -}}
